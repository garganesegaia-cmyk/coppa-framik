<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coppa Framik</title>
<meta name="theme-color" content="#fcfcf9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfcf9;--dot:#dedfd2;--felt:#2f5a43;--ink:#23241f;--mute:#77786c;
--g:#e8832a;--gp:#ffe0bd;--f:#2c97a8;--fp:#cbeaef}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100dvh;color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif;
background:radial-gradient(var(--dot) 1.3px,transparent 1.6px) 0 0/22px 22px,var(--bg);
padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
display:flex;flex-direction:column;align-items:center;gap:22px}
.hand{font-family:'Patrick Hand',cursive;font-weight:400}
.tag{background:var(--felt);color:#fff;padding:10px 22px;border-radius:6px;margin-top:6px;
outline:2px dashed rgba(255,255,255,.55);outline-offset:-6px;font-size:26px;transform:rotate(-1.5deg);
box-shadow:3px 4px 0 rgba(35,36,31,.18)}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:10px}
.card{position:relative;border-radius:10px;padding:34px 10px 20px;text-align:center;
box-shadow:4px 5px 0 rgba(35,36,31,.16);outline:2px dashed rgba(35,36,31,.22);outline-offset:-7px}
.card.g{background:var(--gp);transform:rotate(-1.6deg);color:#7a3a05}
.card.f{background:var(--fp);transform:rotate(1.3deg);color:#0f4b56;margin-top:10px}
.card .n{font-size:26px}
.card .s{font:900 76px/1 Nunito,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
.card .you{font-size:15px;opacity:.75;min-height:20px}
.clip{position:absolute;top:-14px;left:50%;margin-left:-10px;width:20px;height:44px}
.cup{position:absolute;right:-12px;top:-26px;font-size:36px;transform:rotate(14deg);display:none}
.card.lead .cup{display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.bump{animation:bump .5s cubic-bezier(.3,1.7,.5,1)}
.status{text-align:center;color:var(--mute);font-size:14px;min-height:20px}
.status.err{color:#b3261e}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--f);outline-offset:3px}
.add{background:var(--felt);color:#fff;font-size:20px;font-weight:800;padding:16px;border-radius:12px;
box-shadow:0 5px 0 #1d3b2c;transition:transform .1s,box-shadow .1s}
.add:active{transform:translateY(4px);box-shadow:0 1px 0 #1d3b2c}
h2{font-size:22px}
.log{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.log li{background:#fff;border-radius:6px;padding:9px 12px;display:flex;gap:8px;align-items:center;
box-shadow:2px 3px 0 rgba(35,36,31,.12);border-left:6px solid var(--c)}
.log .t{flex:1;font-size:15px}.log small{color:var(--mute);font-weight:600}
.undo{background:none;text-decoration:underline;color:var(--mute);font-size:14px;padding:4px}
.empty{color:var(--mute);font-size:15px;padding:6px 2px}
.scrim{position:fixed;inset:0;background:rgba(35,36,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));
display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1;min-width:60px;padding:11px 8px;border-radius:999px;background:#ecebe2;font-weight:800;font-size:17px}
.pill[aria-pressed=true]{background:var(--felt);color:#fff}
.pill.wg[aria-pressed=true]{background:var(--g)}.pill.wf[aria-pressed=true]{background:var(--f)}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:2px solid #d6d6c8;background:#fff}
.sug{font-size:15px;padding:6px 12px;background:#fff;border-radius:999px;border:2px dashed #cfcfc0}
.who{display:flex;flex-direction:column;gap:12px}
.stamp{position:fixed;left:50%;top:40%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;
border:7px double currentColor;display:flex;align-items:center;justify-content:center;
font:900 62px Nunito,sans-serif;z-index:9;pointer-events:none;animation:stamp 1.7s both;mix-blend-mode:multiply;background:rgba(255,255,255,.35)}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-32deg)}22%{opacity:1;transform:scale(.9) rotate(-12deg)}32%{transform:scale(1.04) rotate(-12deg)}42%{transform:scale(1) rotate(-12deg)}85%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-12deg)}}
@keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(8px) scale(.98)}100%{transform:translateY(0)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(14deg)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.fest{position:fixed;inset:0;z-index:20;background:#182820;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.fest[hidden]{display:none}
#conf{position:fixed;inset:0;pointer-events:none}
.fbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px;text-align:center;color:#fff}
.fbox svg{width:200px;height:auto;animation:drop 1s cubic-bezier(.3,1.5,.5,1) .15s both}
.fyear{font-size:24px}
.fname{background:var(--gp);color:#7a3a05;font-size:38px;padding:8px 26px;border-radius:8px;outline:2px dashed rgba(35,36,31,.3);outline-offset:-6px;box-shadow:4px 5px 0 rgba(0,0,0,.3);transform:rotate(-2deg);animation:pop2 .6s cubic-bezier(.3,1.6,.5,1) .9s both}
.fname.fr{background:var(--fp);color:#0f4b56}
.fname.tie{background:#fff;color:var(--ink)}
.fsc{font-size:15px;color:#d9dacd}
.fgo{background:var(--g);color:#23241f;font-size:19px;font-weight:800;padding:14px 22px;border-radius:12px;box-shadow:0 5px 0 #a85a14;margin-top:6px;opacity:0;pointer-events:none}
.fgo.show{opacity:1;pointer-events:auto;animation:rise .7s cubic-bezier(.2,1.2,.4,1) backwards}
#foam{position:fixed;inset:0;pointer-events:none}
.fgo:active{transform:translateY(4px);box-shadow:0 1px 0 #a85a14}
.bottle{position:fixed;left:50%;bottom:6px;width:100px;margin-left:-50px;transform-origin:50% 100%;transform:translateY(480px);pointer-events:none;visibility:hidden}
.bottle.on{visibility:visible}
.corkd{position:fixed;width:18px;height:13px;margin:-7px 0 0 -9px;border-radius:4px;background:#d9a066;border:2px solid #8a5a00;z-index:30;pointer-events:none}
.pop{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;z-index:29;pointer-events:none}
.albo li{background:#fff;border-radius:6px;padding:8px 12px;box-shadow:2px 3px 0 rgba(35,36,31,.12);font-size:15px}
@keyframes drop{from{transform:translateY(-260px) scale(1.5) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop2{from{transform:scale(0) rotate(-2deg)}to{transform:scale(1) rotate(-2deg)}}
@keyframes rise{from{transform:translateY(110px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="tag hand" id="tag">Coppa Framik 2026</div>
<main>
  <div class="cards">
    <section class="card g" id="cg"><svg class="clip" viewBox="0 0 20 44" fill="none" stroke="#c7c7bb" stroke-width="3" stroke-linecap="round"><path d="M6 30V9a4 4 0 0 1 8 0v26a7 7 0 0 1-14 0V12"/></svg><span class="cup">🏆</span>
      <div class="n hand">Gaia</div><div class="s" id="sg">–</div><div class="you hand" id="yg"></div></section>
    <section class="card f" id="cf"><svg class="clip" viewBox="0 0 20 44" fill="none" stroke="#c7c7bb" stroke-width="3" stroke-linecap="round"><path d="M6 30V9a4 4 0 0 1 8 0v26a7 7 0 0 1-14 0V12"/></svg><span class="cup">🏆</span>
      <div class="n hand">Francesco</div><div class="s" id="sf">–</div><div class="you hand" id="yf"></div></section>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Mi collego…</div>
  <button class="add" id="open">Aggiungi punti</button>
  <div>
    <h2 class="hand">Ultime sfide</h2>
    <ul class="log" id="log"></ul>
  </div>
  <div class="albo" id="albo" hidden>
    <h2 class="hand">Albo d'oro</h2>
    <ul class="log" id="albolist"></ul>
  </div>
  <button class="undo" id="swap" style="align-self:center"></button>
</main>

<div class="scrim" id="idm" hidden><div class="sheet" role="dialog" aria-label="Chi sei?">
  <h2 class="hand">Chi sei?</h2>
  <div class="row"><button class="pill wg" data-me="g">Gaia</button><button class="pill wf" data-me="f">Francesco</button></div>
  <p class="status">Lo ricordo su questo telefono.</p>
</div></div>

<div class="scrim" id="sh" hidden><div class="sheet" role="dialog" aria-label="Aggiungi punti">
  <div class="who"><h2 class="hand">Chi ha vinto?</h2>
    <div class="row"><button class="pill wg" data-w="g" aria-pressed="false">Gaia</button><button class="pill wf" data-w="f" aria-pressed="false">Francesco</button></div></div>
  <div><h2 class="hand">Quanti punti?</h2>
    <div class="row" id="pts" style="margin-top:8px"><button class="pill" data-p="1">1</button><button class="pill" data-p="2">2</button><button class="pill" data-p="3">3</button><button class="pill" data-p="5">5</button><button class="pill" data-p="10">10</button></div>
    <input id="cust" type="number" inputmode="numeric" min="1" max="999" placeholder="Altro numero" style="margin-top:8px"></div>
  <div><h2 class="hand">Per cosa?</h2>
    <input id="why" maxlength="40" placeholder="Es. ping pong" style="margin-top:8px">
    <div class="row" style="margin-top:8px"><button class="sug hand">Ping pong</button><button class="sug hand">Gioco da tavola</button><button class="sug hand">Scommessa</button></div></div>
  <button class="add" id="go">Timbra!</button>
  <button class="undo" id="cancel">Annulla</button>
</div></div>

<div class="fest" id="fest" hidden role="dialog" aria-label="Vincitore dell'anno">
  <canvas id="conf"></canvas>
  <div class="fbox">
    <svg viewBox="0 0 200 224" role="img" aria-label="Coppa dorata con un cono gelato inciso">
      <defs>
        <clipPath id="ccl2"><path d="M27 72L73 72L50 146Z"/></clipPath>
        <symbol id="cono2" viewBox="0 0 100 150">
          <g clip-path="url(#ccl2)" stroke="#8a5a00" stroke-width="2.6" fill="none" stroke-linecap="round">
            <path d="M0 -74L100 126M0 -46L100 154M0 -18L100 182M0 10L100 210M0 38L100 238"/>
            <path d="M0 126L100 -74M0 154L100 -46M0 182L100 -18M0 210L100 10M0 238L100 38"/>
          </g>
          <path d="M27 72L48 143Q50 149 52 143L73 72" fill="none" stroke="#8a5a00" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="50" cy="42" r="28" fill="#fff3c2"/>
          <path d="M26 56Q14 58 16 67Q18 75 28 72Q34 70 38 74Q44 80 52 73Q58 68 64 73Q72 78 80 72Q86 68 83 62Q81 57 74 56Z" fill="#fff3c2"/>
          <path d="M26 56A28 28 0 1 1 74 56" fill="none" stroke="#8a5a00" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M26 56Q14 58 16 67Q18 75 28 72Q34 70 38 74Q44 80 52 73Q58 68 64 73Q72 78 80 72Q86 68 83 62Q81 57 74 56" fill="none" stroke="#8a5a00" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M36 28Q38 25 42 24M60 24Q65 25 68 29M33 44Q33 40 34 37M64 48Q66 44 66 41M47 50Q52 52 57 50" fill="none" stroke="#8a5a00" stroke-width="2.6" stroke-linecap="round"/>
        </symbol>
      </defs>
      <path d="M46 52C6 50 6 108 58 104" fill="none" stroke="#8a5a00" stroke-width="13" stroke-linecap="round"/>
      <path d="M154 52C194 50 194 108 142 104" fill="none" stroke="#8a5a00" stroke-width="13" stroke-linecap="round"/>
      <path d="M46 52C6 50 6 108 58 104" fill="none" stroke="#f4c24a" stroke-width="7" stroke-linecap="round"/>
      <path d="M154 52C194 50 194 108 142 104" fill="none" stroke="#f4c24a" stroke-width="7" stroke-linecap="round"/>
      <path d="M92 134H108L113 176H87Z" fill="#f4c24a" stroke="#8a5a00" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="100" cy="154" rx="15" ry="6" fill="#f8d66a" stroke="#8a5a00" stroke-width="3"/>
      <path d="M40 40H160C160 100 136 132 100 136C64 132 40 100 40 40Z" fill="#f4c24a" stroke="#8a5a00" stroke-width="3" stroke-linejoin="round"/>
      <rect x="35" y="32" width="130" height="13" rx="6" fill="#f8d66a" stroke="#8a5a00" stroke-width="3"/>
      <path d="M50 60C50 88 58 106 72 118" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
      <use href="#cono2" x="72" y="50" width="56" height="84"/>
      <rect x="58" y="176" width="84" height="15" rx="4" fill="#f4c24a" stroke="#8a5a00" stroke-width="3"/>
      <rect x="44" y="191" width="112" height="22" rx="5" fill="#f4c24a" stroke="#8a5a00" stroke-width="3"/>
      <rect x="68" y="196" width="64" height="12" rx="2" fill="#fff3c2" stroke="#8a5a00" stroke-width="1.6"/>
      <path d="M164 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f8e08a"/>
      <path d="M30 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f8e08a"/>
    </svg>
    <div class="fyear hand" id="fyear"></div>
    <div class="fname hand" id="fname"></div>
    <div class="fsc hand" id="fsc"></div>
    <button class="fgo" id="fgo"></button>
  </div>
  <svg class="bottle" id="bottle" viewBox="0 0 120 330" aria-hidden="true">
    <path d="M49 40C49 90 44 122 28 160C10 202 4 232 4 264C4 304 16 324 60 324C104 324 116 304 116 264C116 232 110 202 92 160C76 122 71 90 71 40Z" fill="#2f8a3a" stroke="#0e2a14" stroke-width="3" stroke-linejoin="round"/>
    <path d="M8 292Q60 314 112 292C112 314 100 324 60 324C20 324 8 314 8 292Z" fill="#14401c"/>
    <path d="M26 206C20 238 20 272 30 298" fill="none" stroke="#9fd66a" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/>

  </svg>
  <canvas id="foam"></canvas>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBE2_zYLSc-AYQZLMO-NCJTUCUVmxpnP68",
  authDomain: "coppa-framik.firebaseapp.com",
  projectId: "coppa-framik",
  storageBucket: "coppa-framik.firebasestorage.app",
  messagingSenderId: "160414945548",
  appId: "1:160414945548:web:c12e7f03fbc3a3232b3929"
};
const ROOM = "f7k2-m9q4-x8p3";   // nome "segreto" del documento: non cambiarlo dopo l'inizio
const NAME = { g: "Gaia", f: "Francesco" };
const COL = { g: "var(--g)", f: "var(--f)" };
const $ = id => document.getElementById(id);
const ref = doc(getFirestore(initializeApp(firebaseConfig)), "coppa", ROOM);

const NOW = new Date().getFullYear();
let me = null, data = { g: 0, f: 0, log: [], year: NOW, storia: [] }, shown = { g: null, f: null };
let festOpen = false, previewDone = false;
const preview = location.search.includes("festa");
try { me = localStorage.getItem("framik-me"); } catch (e) {}

function say(t, err) { const s = $("status"); s.textContent = t; s.className = "status" + (err ? " err" : ""); }

function count(k, to) {
  const el = $("s" + k), from = shown[k] ?? to; shown[k] = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 600);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  })(t0);
  const c = $("c" + k); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}

function render() {
  $("tag").textContent = "Coppa Framik " + data.year;
  const al = $("albolist"); al.innerHTML = ""; $("albo").hidden = !data.storia.length;
  data.storia.slice().reverse().forEach(e => {
    const w = e.g === e.f ? null : (e.g > e.f ? "g" : "f");
    const li = document.createElement("li");
    li.style.setProperty("--c", w ? COL[w] : "#b9b9ab");
    li.textContent = e.y + " · " + (w ? NAME[w] + " vince " + Math.max(e.g, e.f) + " a " + Math.min(e.g, e.f) : "Pareggio " + e.g + " a " + e.f);
    al.append(li);
  });
  count("g", data.g); count("f", data.f);
  $("cg").classList.toggle("lead", data.g > data.f);
  $("cf").classList.toggle("lead", data.f > data.g);
  $("yg").textContent = me === "g" ? "(sei tu)" : "";
  $("yf").textContent = me === "f" ? "(sei tu)" : "";
  $("swap").textContent = me ? "Non sei " + NAME[me] + "?" : "";
  const ul = $("log"); ul.innerHTML = "";
  const items = data.log.slice(-8).reverse();
  if (!items.length) ul.innerHTML = '<li class="empty" style="border:0;box-shadow:none;background:none">Ancora nessuna sfida: aggiungi la prima.</li>';
  items.forEach((e, i) => {
    const li = document.createElement("li");
    li.style.setProperty("--c", COL[e.w]);
    const d = new Date(e.t).toLocaleDateString("it-IT", { day: "numeric", month: "short" });
    li.innerHTML = '<span class="t"></span>';
    li.firstChild.textContent = NAME[e.w] + " +" + e.p + (e.m ? " · " + e.m : "");
    const sm = document.createElement("small"); sm.textContent = d; li.append(sm);
    if (i === 0) { const b = document.createElement("button"); b.className = "undo"; b.textContent = "Annulla"; b.onclick = undo; li.append(b); }
    ul.append(li);
  });
}

onSnapshot(ref, s => {
  if (s.exists()) { const d = s.data(); data = { g: d.g || 0, f: d.f || 0, log: d.log || [], year: d.year || NOW, storia: d.storia || [] }; }
  say(""); render();
  if (preview) { if (!festOpen && !previewDone) { previewDone = true; openFest(); } }
  else if (data.year < NOW) celebrate();
  else if (festOpen) { $("fest").hidden = true; festOpen = false; }
}, () => say("Non riesco a leggere il punteggio. Controlla le regole di Firestore.", true));

async function save(fn) {
  try {
    await runTransaction(ref.firestore, async tx => {
      const s = await tx.get(ref);
      const d = s.exists() ? s.data() : { year: NOW, g: 0, f: 0, log: [] };
      fn(d); tx.set(ref, d);
    });
    return true;
  } catch (e) { say("Non salvato: sei online? Riprova.", true); return false; }
}

async function undo() {
  if (!confirm("Annullo l'ultima sfida?")) return;
  await save(d => { const e = d.log.pop(); if (e) d[e.w] -= e.p; });
}

// --- chi sei
function askMe() { $("idm").hidden = false; }
document.querySelectorAll("[data-me]").forEach(b => b.onclick = () => {
  me = b.dataset.me; try { localStorage.setItem("framik-me", me); } catch (e) {}
  $("idm").hidden = true; render();
});
$("swap").onclick = askMe;
if (!me) askMe();

// --- foglio per aggiungere
let W = null, P = null;
const sync = () => {
  document.querySelectorAll("[data-w]").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === W));
  document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p) === String(P)));
};
$("open").onclick = () => { W = me; P = null; $("cust").value = ""; $("why").value = ""; sync(); $("sh").hidden = false; };
$("cancel").onclick = () => $("sh").hidden = true;
$("sh").onclick = e => { if (e.target.id === "sh") $("sh").hidden = true; };
document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { W = b.dataset.w; sync(); });
document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { P = +b.dataset.p; $("cust").value = ""; sync(); });
$("cust").oninput = () => { P = parseInt($("cust").value) || null; sync(); };
document.querySelectorAll(".sug").forEach(b => b.onclick = () => $("why").value = b.textContent);

$("go").onclick = async () => {
  if (!W || !P || P < 1 || P > 999) { say("Scegli chi ha vinto e quanti punti.", true); return; }
  const w = W, p = P, m = $("why").value.trim();
  $("sh").hidden = true;
  if (await save(d => { d[w] += p; d.log = [...d.log, { w, p, m, t: Date.now() }].slice(-200); })) {
    const st = document.createElement("div");
    st.className = "stamp"; st.textContent = "+" + p; st.style.color = w === "g" ? "var(--g)" : "var(--f)";
    document.body.append(st); setTimeout(() => st.remove(), 1800);
  }
};
// --- capodanno
const PHRASE = "Nuovo anno, nuova sfida";
$("fgo").textContent = PHRASE;
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
let festRun = 0;

function roll(d) {
  if ((d.year || NOW) >= NOW) return;
  d.storia = [...(d.storia || []), { y: d.year, g: d.g, f: d.f }].slice(-50);
  d.year = NOW; d.g = 0; d.f = 0; d.log = [];
}

function celebrate() {
  if (festOpen) return;
  festOpen = true;
  if (!data.g && !data.f) { save(roll).then(() => festOpen = false); return; }
  openFest();
}

function openFest() {
  festOpen = true;
  const run = ++festRun;
  const w = data.g === data.f ? null : (data.g > data.f ? "g" : "f");
  $("fname").textContent = w ? NAME[w] : "Gaia e Francesco";
  $("fname").className = "fname hand " + (w === "f" ? "fr" : w ? "" : "tie");
  $("fyear").textContent = (w ? "Vince la Coppa Framik " : "Pareggio nella Coppa Framik ") + data.year;
  $("fsc").textContent = "Gaia " + data.g + " · Francesco " + data.f + (preview ? " (anteprima)" : "");
  $("fgo").classList.remove("show");
  const bt = $("bottle"); bt.classList.remove("on"); bt.getAnimations().forEach(a => a.cancel());
  $("fest").hidden = false;
  if (reduced) { $("fgo").classList.add("show"); return; }
  party(run);
}

$("fgo").onclick = async () => {
  if (preview) { $("fest").hidden = true; festOpen = false; return; }
  if (await save(roll)) { $("fest").hidden = true; festOpen = false; }
};

function foam(ox, oy, ok) {
  return new Promise(resolve => {
    const cv = $("foam"), cx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight, sc = Math.max(1, Math.min(W, H) / 400);
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const creams = ["255,251,238", "255,246,224", "252,240,210"];
    const far = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy));
    const bs = [], N = Math.round(W * H / (850 * sc * sc));
    for (let i = 0; i < N; i++) {
      const x = Math.random() * W, y = Math.random() * H, r = (14 + Math.random() * 30) * sc;
      const start = Math.hypot(x - ox, y - oy) / far * 1300 + Math.random() * 200;
      let pop = 1700 + Math.random() * 1700; if (pop < start + 600) pop = start + 600 + Math.random() * 500;
      bs.push({ x, y, r, start, pop, c: creams[i % 3] });
    }
    const end = Math.max(...bs.map(b => b.pop)) + 300, t0 = performance.now();
    (function f(now) {
      if (!ok()) { cx.clearRect(0, 0, W, H); resolve(); return; }
      const t = now - t0; cx.clearRect(0, 0, W, H);
      for (const b of bs) {
        if (t < b.start || t > b.pop + 260) continue;
        const u = Math.min(1, (t - b.start) / 300) - 1;
        let k = 1 + 2.70158 * u * u * u + 1.70158 * u * u, a = 1;
        if (t > b.pop) { const q = (t - b.pop) / 260; a = 1 - q; k *= 1 + .3 * q; }
        const r = b.r * k;
        cx.beginPath(); cx.arc(b.x, b.y, r, 0, 7); cx.fillStyle = "rgba(" + b.c + "," + (.97 * a) + ")"; cx.fill();
        cx.lineWidth = 2.2; cx.strokeStyle = "rgba(224,186,110," + (.9 * a) + ")"; cx.stroke();
        cx.beginPath(); cx.arc(b.x - r * .18, b.y - r * .18, r * .62, Math.PI * 1.08, Math.PI * 1.55);
        cx.lineWidth = 2.4; cx.strokeStyle = "rgba(255,255,255," + a + ")"; cx.stroke();
      }
      if (t < end) requestAnimationFrame(f); else { cx.clearRect(0, 0, W, H); resolve(); }
    })(t0);
  });
}

function party(run) {
  const ok = () => run === festRun && !$("fest").hidden;
  const later = (ms, fn) => setTimeout(() => ok() && fn(), ms);
  const cv = $("conf"), cx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#e8832a", "#2c97a8", "#2f5a43", "#f4c24a", "#ffffff", "#c9b6e8", "#f4a9b8"];
  const ps = [];
  const shoot = (x, y, a, n, sp, gold) => {
    for (let i = 0; i < n; i++) {
      const an = a + (Math.random() - .5) * .9, v = sp * (.45 + Math.random() * .7);
      ps.push({ x, y, vx: Math.cos(an) * v, vy: Math.sin(an) * v, w: gold ? 5 : 7 + Math.random() * 6, h: gold ? 5 : 4 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: gold ? "#f8e08a" : cols[i % cols.length], g: gold });
    }
  };
  let frames = 0;
  (function tick() {
    cx.clearRect(0, 0, W, H);
    if (!ok()) return;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i]; p.vy += p.g ? .5 : .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 30) { ps.splice(i, 1); continue; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.g) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); } else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
    if (frames++ < 1100) requestAnimationFrame(tick);
  })();

  // 1) subito: coriandoli
  [200, 1300, 2600].forEach(t => later(t, () => { shoot(0, H, -1.1, 55, 19); shoot(W, H, -2.05, 55, 19); }));

  // 2) dopo 5 secondi: la bottiglia sale da sotto, si agita, salta il tappo, schiuma
  const bt = $("bottle"), tip = $("tip");
  later(5000, () => {
    bt.classList.add("on");
    bt.animate([{ transform: "translateY(480px)" }, { transform: "translateY(0)" }], { duration: 900, easing: "cubic-bezier(.2,.9,.3,1.1)", fill: "forwards" });
  });
  later(5950, () => {
    const k = [0, -9, 9, -11, 11, -13, 13, -7, 0].map(d => ({ transform: "translateY(0) rotate(" + d + "deg)" }));
    bt.animate(k, { duration: 1050, fill: "forwards" });
  });
  later(7100, () => {
    const r = tip.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const c = document.createElement("div"); c.className = "corkd"; c.style.left = x + "px"; c.style.top = y + "px"; document.body.append(c);
    c.animate([
      { transform: "translate(0,0) rotate(0deg)", easing: "cubic-bezier(.15,.7,.4,1)" },
      { transform: "translate(50px,-420px) rotate(380deg)", offset: .5, easing: "cubic-bezier(.6,0,.9,.6)" },
      { transform: "translate(110px,110px) rotate(780deg)", opacity: 0 }
    ], { duration: 1600, fill: "forwards" }).onfinish = () => c.remove();
    const f = document.createElement("div"); f.className = "pop"; f.style.left = x + "px"; f.style.top = y + "px"; document.body.append(f);
    f.animate([{ transform: "scale(.3)", opacity: .9 }, { transform: "scale(3.4)", opacity: 0 }], { duration: 380 }).onfinish = () => f.remove();
    [0, 150, 300, 500].forEach((t, i) => later(t, () => shoot(x, y, -1.57, 44 - i * 9, 17, true)));
    foam(x, y, ok).then(() => { if (ok()) $("fgo").classList.add("show"); });
  });
  later(9300, () => bt.animate([{ transform: "translateY(0)" }, { transform: "translateY(480px)" }], { duration: 700, easing: "ease-in", fill: "forwards" }));
  later(16000, () => $("fgo").classList.add("show"));
}
